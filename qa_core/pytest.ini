[pytest]
testpaths = tests/api
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -n auto --dist loadgroup --reruns 1
markers =
    smoke: Quick regression tests (run on PR)
    regression: Full regression suite (run nightly)
    security: Authentication and authorization tests
    performance: Latency and load guardrail tests
