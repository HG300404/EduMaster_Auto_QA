version: '3.8'

networks:
  sut-network:
  tms-network:

services:
  # ==========================================
  # SYSTEM UNDER TEST (SUT)
  # ==========================================
  postgres-test:
    image: postgres:15
    container_name: edumaster-postgres-test
    environment:
      - POSTGRES_DB=edumaster_test
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d edumaster_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sut-network

  minio:
    image: minio/minio:latest
    container_name: edumaster-minio-test
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sut-network

  redis:
    image: redis:7-alpine
    container_name: edumaster-redis-test
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sut-network

  backend:
    build:
      context: ${EDUMASTER_ROOT:-../edumaster_podman/edumaster}/backend
      dockerfile: Dockerfile
    container_name: edumaster-backend-test
    command: ["sh", "-c", "tr -d '\r' < ./entrypoint.sh > ./run.sh && chmod +x ./run.sh && ./run.sh"]
    volumes:
      - ${EDUMASTER_ROOT:-../edumaster_podman/edumaster}/infrastructure/scripts/entrypoint.sh:/app/entrypoint.sh
    environment:
      - DATABASE_URL=postgresql://test:test@postgres-test:5432/edumaster_test
      - FLASK_ENV=testing
      - FLASK_APP=app:create_app()
      - FLASK_DEBUG=1
      - STORAGE_TYPE=minio
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=False
      - MINIO_BUCKET_NAME=edumaster-files
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres-test:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sut-network

  frontend:
    build:
      context: ${EDUMASTER_ROOT:-../edumaster_podman/edumaster}/frontend
      dockerfile: Dockerfile
    container_name: edumaster-frontend-test
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - sut-network

  # ==========================================
  # TEST MANAGEMENT SYSTEM (TMS)
  # ==========================================
  qa-db:
    image: postgres:15
    container_name: qa-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=qa_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - qa_db_data:/var/lib/postgresql/data
    networks:
      - tms-network

  qa-backend:
    build: ./qa_backend
    container_name: qa-backend
    restart: always
    command: ["python3", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - qa-db
    env_file:
      - ./qa_backend/.env
    ports:
      - "8001:8000"
    environment:
      - BASE_TEST_DIR=/app/qa_core/tests
      - REPORT_DIR=/app/qa_core/reports
      - LOG_DIR=/app/qa_core/tests/logs
      - BASE_URL=http://frontend:80
    volumes:
      - ./qa_backend/app:/app/app
      - ./qa_backend/seed.py:/app/seed.py
      - ./qa_backend/seed_incremental.py:/app/seed_incremental.py
      - ./qa_backend/seed_helpers.py:/app/seed_helpers.py
      - ./qa_core:/app/qa_core
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tms-network
      - sut-network

  qa-frontend:
    build: ./qa_frontend
    container_name: qa-frontend
    restart: always
    ports:
      - "3001:5173"
    volumes:
      - ./qa_frontend:/app
      - /app/node_modules
    networks:
      - tms-network

volumes:
  qa_db_data:
  minio_data:
